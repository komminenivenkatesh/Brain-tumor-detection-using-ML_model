services:
  # Backend deployment
  - type: web
    name: braintumor-backend
    env: python
    buildCommand: "cd web_app/backend && pip install -r requirements.txt"
    startCommand: "cd web_app/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: brain_tumor_db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*" # Update this to your frontend URL once deployed
